# Render Blueprint — creates the API server (which also serves the admin dashboard at /admin)
# and a PostgreSQL database. Render dashboard → New → Blueprint → pick this repository.
# TEST MODE is on: OTP is shown in the app and payments are simulated. See docs/GO_LIVE.md to switch it off.
services:
  - type: web
    name: myrepairunder100-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w apps/admin && npm run build -w server
    startCommand: cd server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TEST_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: myrepairunder100-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: OTP_DEV_ECHO
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: MAPS_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: log
      - key: STORAGE_PROVIDER
        value: local
      - key: RUN_JOBS
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: myrepairunder100-db
    plan: free
    region: singapore
    databaseName: mru
