# Builds installable Android APKs for the customer and technician apps.
# GitHub → Actions → "Build Android APKs" → Run workflow → paste your server address.
# The APKs appear under Releases. No Expo account or Android Studio needed.
name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address, e.g. https://myrepairunder100-api.onrender.com"
        required: true
      apps:
        description: "Which apps"
        type: choice
        options: [both, customer, technician]
        default: both

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [customer, technician]
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Skip?
        id: skip
        run: echo "skip=${{ inputs.apps != 'both' && inputs.apps != matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip != 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: steps.skip.outputs.skip != 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        if: steps.skip.outputs.skip != 'true'
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Generate Android project
        if: steps.skip.outputs.skip != 'true'
        working-directory: apps/${{ matrix.app }}
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build APK
        if: steps.skip.outputs.skip != 'true'
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename
        if: steps.skip.outputs.skip != 'true'
        run: cp apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk MyRepairUnder100-${{ matrix.app }}.apk
      - name: Publish to Releases
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Android APKs #${{ github.run_number }} (${{ inputs.api_url }})"
          body: "Test build connected to ${{ inputs.api_url }}. Install on Android: download the APK on the phone and allow 'Install unknown apps'."
          files: MyRepairUnder100-${{ matrix.app }}.apk
